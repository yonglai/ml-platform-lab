# Values for prometheus-community/prometheus, release name "prometheus",
# namespace "monitoring". Kept small on purpose: one node, one server.

# Not needed for this lab: no alert routing yet, no push jobs, no host metrics.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false

# Kept: reports pod readiness and restart counts (used for the alert in 6e).
kube-state-metrics:
  enabled: true

server:
  retention: 7d
  global:
    scrape_interval: 15s
  # History lives on a 5Gi local-path volume, so it survives pod deletion.
  # (Step 6b first ran with enabled: false to test that; history was lost.)
  persistentVolume:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# One alert rule (Alertmanager is off, so it shows on the Prometheus Alerts page, not as a notification).
serverFiles:
  alerting_rules.yml:
    groups:
      - name: ml-platform
        rules:
          - alert: ServingUnavailable
            expr: kube_deployment_status_replicas_available{namespace="ml-platform", deployment="serving"} < 1
            for: 2m
            labels:
              severity: page
            annotations:
              summary: "No serving pod has been Ready for 2 minutes"
