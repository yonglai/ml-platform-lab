# Model serving: resolves the `prod` alias once at start, then serves that exact version.
# Roll out a newly promoted version with: kubectl -n ml-platform rollout restart deploy/serving
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving
  namespace: ml-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # keep the old pod until the new one is Ready
  selector:
    matchLabels:
      app.kubernetes.io/name: serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: serving
    spec:
      containers:
        - name: serving
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir mlflow==3.18.0 scikit-learn==1.9.1 \
                pandas==3.1.0 numpy==2.5.4 scipy==1.18.1 skops==0.16.0 &&
              VERSION=$(python -c "from mlflow import MlflowClient; print(MlflowClient().get_model_version_by_alias('${MODEL_NAME}', '${MODEL_ALIAS}').version)") &&
              echo "resolved ${MODEL_NAME}@${MODEL_ALIAS} -> v${VERSION}" &&
              exec mlflow models serve -m "models:/${MODEL_NAME}/${VERSION}" \
                --host 0.0.0.0 --port 5001 --workers 1 --env-manager local
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MODEL_NAME
              value: propensity-model
            - name: MODEL_ALIAS
              value: prod
          ports:
            - containerPort: 5001
          startupProbe:         # pip install + model download make the first start slow
            httpGet:
              path: /ping
              port: 5001
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: 5001
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 5001
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: serving
  namespace: ml-platform
spec:
  selector:
    app.kubernetes.io/name: serving
  ports:
    - name: http
      port: 5001
      targetPort: 5001
