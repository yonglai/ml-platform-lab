# MLflow tracking server + model registry.
# Metadata -> Postgres (10-postgres.yaml). Artifacts -> PVC below, proxied through the server.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: ml-platform
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-platform
spec:
  replicas: 1
  strategy:
    type: Recreate # one pod owns the RWO volume at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
    spec:
      containers:
        - name: mlflow
          image: python:3.12-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir mlflow==3.18.0 psycopg2-binary &&
              exec mlflow server \
                --host 0.0.0.0 --port 5000 --workers 2 \
                --backend-store-uri "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
                --serve-artifacts --artifacts-destination /mlartifacts \
                --allowed-hosts "localhost:5000,127.0.0.1:5000,mlflow,mlflow:5000,mlflow.ml-platform,mlflow.ml-platform:5000,mlflow.ml-platform.svc,mlflow.ml-platform.svc:5000,mlflow.ml-platform.svc.cluster.local,mlflow.ml-platform.svc.cluster.local:5000"
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
          startupProbe: # pip install makes the first start slow
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-platform
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
