# Only the MLflow pods may open connections to Postgres (port 5432).
# Everything else in the cluster, including the prober and any other pod, is refused.
# Needs a network plugin that enforces NetworkPolicy; the test in LOG.md checks that k3s does.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-mlflow-only
  namespace: ml-platform
spec:
  podSelector:                       # the pods this policy protects
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]             # rules for incoming connections only
  ingress:
    - from:
        - podSelector:               # allowed callers: pods in this namespace labelled mlflow
            matchLabels:
              app.kubernetes.io/name: mlflow
      ports:
        - protocol: TCP
          port: 5432
